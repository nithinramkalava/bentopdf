name: Sync fork to latest BentoPDF release

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-on-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Merge latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/alam00000/bentopdf/releases/latest | jq -r .tag_name)
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Could not determine latest release tag"; exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/alam00000/bentopdf.git || true
          git fetch upstream --tags --force

          if git merge-base --is-ancestor "refs/tags/$TAG" HEAD; then
            echo "Already contains $TAG. Nothing to do."
            exit 0
          fi

          git merge --no-commit --no-ff "refs/tags/$TAG"
          git restore --source=HEAD --staged --worktree .github/workflows
          if git diff --cached --quiet; then
            echo "No syncable changes after preserving fork workflows."
            git merge --abort
            exit 0
          fi
          git commit -m "chore: merge upstream release $TAG"
          git push origin HEAD:main
